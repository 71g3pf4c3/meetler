# Dev-override: Caddy в HTTP на :8088 (без TLS/ACME) + LiveKit анонсирует 127.0.0.1.
# Запуск: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# URL: http://localhost:8088
services:
  # LiveKit в dev анонсирует loopback-кандидаты (node_ip=127.0.0.1,
  # use_external_ip=false). Иначе на VM он отдаёт публичный IP, и локальный
  # браузер не может установить ICE → "could not establish pc connection".
  livekit:
    volumes:
      - ./livekit/livekit.dev.yaml:/etc/livekit.yaml:ro
      - ./certs:/certs:ro

  caddy:
    ports: !override
      - "8088:8088"
    volumes:
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
