# LiveKit для локальной разработки: media IP 127.0.0.1, TURN выключен.

port: 7880
bind_addresses:
  - "0.0.0.0"

redis:
  address: 127.0.0.1:6379

keys:
  API1af2014f9649: grv8dlPXqtcHAeMv4SZAlTi54j2tZ3xm4Rll5xFhi0KmYW5j

rtc:
  port_range_start: 50000
  port_range_end: 60000

  tcp_port: 7881

  use_external_ip: false
  node_ip: 127.0.0.1

  congestion_control:
    enabled: true
    allow_pause: true
    use_send_side_bwe: true
    send_side_bwe_pacer: no-queue

  allow_tcp_fallback: true
  tcp_fallback_rtt_threshold: 0
  allow_udp_unstable_fallback: true
  packet_buffer_size_video: 1000
  packet_buffer_size_audio: 500

  pli_throttle:
    low_quality: 200ms
    mid_quality: 300ms
    high_quality: 500ms

turn:
  enabled: false
  tls_port: 5349
  domain: localhost
  cert_file: /certs/turn.crt
  key_file: /certs/turn.key
  relay_range_start: 30000
  relay_range_end: 40000

room:
  auto_create: true
  empty_timeout: 900
  departure_timeout: 60
  max_participants: 0
  enabled_codecs:
    - mime: audio/opus
    - mime: video/vp8
    - mime: video/vp9
    - mime: video/h264
  playout_delay:
    enabled: true
    min: 0
    max: 1000

audio:
  active_red_encoding: false

prometheus:
  port: 6789

logging:
  level: info
  json: true
