# CI: линт Go-сервисов и синтаксис фронтенда.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: |
            api/go.sum
            tgbridge/go.sum

      - name: api — build + vet
        working-directory: api
        run: |
          go build ./...
          go vet ./...

      - name: tgbridge — build + vet
        working-directory: tgbridge
        run: |
          go build ./...
          go vet ./...

      - name: фронт — синтаксис (node --check)
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # app.js — ES-модуль: node --check парсит .js как CommonJS и падает
      # на import. Копируем в .mjs, чтобы включить module-режим.
      - run: |
          cp web/app.js /tmp/chk-app.mjs && node --check /tmp/chk-app.mjs
          cp web/critters.js /tmp/chk-crit.mjs && node --check /tmp/chk-crit.mjs
