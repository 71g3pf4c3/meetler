# meetler: nginx, API, LiveKit и необязательный Telegram-мост.
# ICE и TURN используют порты хоста напрямую.

services:
  redis:
    image: redis:7-alpine
    # host-network + bind только на loopback: livekit (тоже host-net) видит redis
    # по 127.0.0.1:6379. Наружу порт не светится. Bridge-сервисам redis не нужен.
    network_mode: host
    command: redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.13.10
    restart: unless-stopped
    # ICE и TURN слушают порты хоста.
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
      - ./certs:/certs:ro   # TLS cert/key для встроенного TURN (см. README)
    depends_on:
      redis:
        condition: service_healthy

  api:
    build: ./api
    restart: unless-stopped
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      TOKEN_TTL: ${TOKEN_TTL:-6h}
      ROOM_MAX_PARTICIPANTS: ${ROOM_MAX_PARTICIPANTS:-30}
      LISTEN_ADDR: ":8080"
      # центральная аутентификация: общий пароль на весь сайт. Пусто = выключено.
      APP_PASSWORD: ${APP_PASSWORD:-}
      # персистентный реестр палат: ROOMS_DIR/<палата>/{sounds,avatars}
      ROOMS_DIR: /data/rooms
      # LiveKit работает в сети хоста; API обращается к нему через host-gateway.
      LIVEKIT_URL: ws://host.docker.internal:7880
      # Telegram-мост доступен через host-gateway при включённом профиле telegram.
      TGBRIDGE_URL: ${TGBRIDGE_URL:-http://host.docker.internal:8090}
    volumes:
      - rooms:/data/rooms         # палаты + их звуки/портреты, переживает рестарт
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [internal]
    expose:
      - "8080"
    # публикуем ТОЛЬКО на loopback хоста: tgbridge (host-network) заливает в
    # аптечку через /soundboardsave по 127.0.0.1:8080. Наружу не светится —
    # публичный доступ идёт через nginx. nginx видит api по internal-сети.
    ports:
      - "127.0.0.1:8080:8080"

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/locations.conf:/etc/nginx/meetler-locations.conf:ro
      - ./web:/srv/web:ro
      - ./certs:/certs:ro
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    networks: [internal]
    # nginx обращается к LiveKit через host-gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api

  # Необязательный профиль: docker compose --profile telegram up.
  # LiveKit доступен мосту по loopback хоста.
  tgbridge:
    build: ./tgbridge
    restart: unless-stopped
    profiles: ["telegram"]
    network_mode: host
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://127.0.0.1:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      DEFAULT_PALATA: ${DEFAULT_PALATA:-telegram}
      # TTS: задай PIPER_MODEL=/models/ru.onnx и примонтируй модель через override,
      # иначе озвучка текста выключена (медиа работает без TTS).
      PIPER_MODEL: ${PIPER_MODEL:-}
      # внутренний HTTP для "15с → TG" (api проксирует сюда). host-network.
      TGBRIDGE_HTTP_ADDR: ${TGBRIDGE_HTTP_ADDR:-:8090}
    depends_on:
      - livekit

networks:
  internal:
    driver: bridge

volumes:
  rooms:
