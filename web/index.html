<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>hit-meet</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, sans-serif; background: #0d0f12; color: #e6e8eb;
      height: 100vh; display: flex; flex-direction: column;
    }
    #join {
      margin: auto; display: flex; flex-direction: column; gap: 12px;
      padding: 32px; background: #15181d; border-radius: 12px; width: 320px;
    }
    #join h1 { margin: 0 0 8px; font-size: 20px; }
    input {
      padding: 10px 12px; border-radius: 8px; border: 1px solid #2a2f37;
      background: #0d0f12; color: #e6e8eb; font-size: 15px;
    }
    button {
      padding: 10px 14px; border-radius: 8px; border: 0; cursor: pointer;
      background: #3b82f6; color: #fff; font-size: 15px; font-weight: 600;
    }
    button:disabled { opacity: .5; cursor: default; }
    button.secondary { background: #2a2f37; }
    button.danger { background: #dc2626; }
    button.goida {
      background: linear-gradient(135deg, #f59e0b, #dc2626);
      font-weight: 800; letter-spacing: 1px;
    }
    button.goida:active { transform: scale(.96); }
    button.goida.playing { animation: goidaPulse .5s ease-in-out infinite alternate; }
    @keyframes goidaPulse {
      from { box-shadow: 0 0 0 0 rgba(245,158,11,.6); }
      to   { box-shadow: 0 0 18px 4px rgba(220,38,38,.8); }
    }
    #stage { flex: 1; display: none; flex-direction: column; min-height: 0; }
    #grid {
      flex: 1; display: grid; gap: 8px; padding: 8px; min-height: 0;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      align-content: start;
    }
    .tile {
      position: relative; background: #000; border-radius: 10px; overflow: hidden;
      aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center;
      outline: 3px solid transparent; outline-offset: -3px;
      transition: outline-color .12s ease, box-shadow .12s ease;
    }
    /* говорящий участник — зелёная рамка + свечение */
    .tile.speaking {
      outline-color: #22c55e;
      box-shadow: 0 0 0 1px #22c55e, 0 0 16px 2px rgba(34,197,94,.55);
    }
    .tile video { width: 100%; height: 100%; object-fit: cover; }
    .tile .label {
      position: absolute; left: 8px; bottom: 8px; padding: 2px 8px;
      background: rgba(0,0,0,.6); border-radius: 6px; font-size: 13px;
    }
    .tile .ph { color: #4b5563; font-size: 14px; }
    #bar {
      display: flex; gap: 8px; justify-content: center; padding: 12px;
      background: #15181d; align-items: center;
    }
    #stats { font-size: 12px; color: #6b7280; margin-left: auto; }
    #err { color: #f87171; font-size: 13px; min-height: 16px; }
  </style>
</head>
<body>
  <div id="join">
    <h1>hit-meet</h1>
    <input id="room" placeholder="Комната (a-z, 0-9, -, _)" autocomplete="off" />
    <input id="name" placeholder="Ваше имя (необязательно)" autocomplete="off" />
    <button id="joinBtn">Войти</button>
    <div id="err"></div>
  </div>

  <div id="stage">
    <div id="grid"></div>
    <div id="bar">
      <button id="micBtn" class="secondary">Mic: on</button>
      <button id="camBtn" class="secondary">Cam: on</button>
      <button id="shareBtn" class="secondary">Демонстрация</button>
      <button id="goidaBtn" class="goida">ГОЙДА</button>
      <button id="recBtn" class="secondary">Скачать 15с (wav)</button>
      <button id="leaveBtn" class="danger">Выйти</button>
      <span id="stats"></span>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
